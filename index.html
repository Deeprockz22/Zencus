<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!--
      index.css declares 10 theme-specific font families beyond these two,
      but this was the only font <link> in the document — so every one of
      them was silently falling back to the system default. Confirmed by
      rendering text in each on a canvas and comparing pixel widths against
      a deliberately fake font name: they matched exactly. All 12 families
      now load from one request, same as Inter/JetBrains Mono already did.
    -->
    <link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Creepster&family=Fira+Code:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=Zen+Maru+Gothic:wght@400;500;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Orbitron:wght@400;500;600;700;800;900&family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Press+Start+2P&family=Space+Grotesk:wght@400;500;600;700&family=Urbanist:wght@400;500;600;700;800&family=VT323&display=swap" rel="stylesheet">
    <title>Zencus — Focused Productivity & Flow</title>
    <meta name="description" content="A minimalist, distraction-free productivity sanctuary for deep work, task focus, and private notes." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
